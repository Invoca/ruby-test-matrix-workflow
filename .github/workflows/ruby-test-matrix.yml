name: Ruby Test Matrix

on:
  workflow_call:
    inputs:
      ruby-versions:
        required: false
        default: "[3.1, 3.2, 3.3, 3.4]"
        type: string
      pre-test-hook:
        required: false
        default: "echo 'No pre-test hook provided. Skipping.'"
        type: string
      test-command:
        required: false
        default: "bundle exec rspec"
        type: string
      coverage-files:
        description: >-
          Comma-separated coverage report paths to upload.
          Set to an empty string to disable the upload step entirely.
        required: false
        default: "coverage/lcov.info"
        type: string
      coverage-flags:
        description: >-
          Comma-separated Codecov flags used to group coverage metrics.
          Each flag must match ^[\w\.\-]{1,45}$ (no slashes).
        required: false
        default: ""
        type: string
      coverage-fail-on-error:
        description: >-
          Fail the job when the Codecov upload errors.
          False by default, matching the informational posture used everywhere else.
        required: false
        default: false
        type: boolean
      coverage-name:
        description: Label shown for this upload in the Codecov UI. Defaults to the matrix cell.
        required: false
        default: ""
        type: string
    secrets:
      CODECOV_TOKEN:
        required: false
        description: >-
          Org-level Codecov upload token. One value works for every repository.
          Omit on public repositories to fall back to tokenless upload.

jobs:
  gemfile-paths:
    runs-on: ubuntu-latest
    outputs:
      gemfiles: ${{ steps.gemfiles.outputs.gemfiles }}
    steps:
    - uses: actions/checkout@v4
    - id: gemfiles
      run: echo "gemfiles=$(find . -type f -iname "*gemfile" | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [gemfile-paths]
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJson(inputs.ruby-versions) }}
        gemfile: ${{ fromJson(needs.gemfile-paths.outputs.gemfiles) }}
        exclude:
        - ruby: "3.1"
          gemfile: "./gemfiles/activerecord_8_0.gemfile"
        - ruby: "3.1"
          gemfile: "./gemfiles/activesupport_8_0.gemfile"
        - ruby: "3.1"
          gemfile: "./gemfiles/rails_8_0.gemfile"
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - run: ${{ inputs.pre-test-hook }}
    - uses: nick-fields/retry@v3
      with:
        max_attempts: 2
        timeout_minutes: 10
        command: ${{ inputs.test-command }}
    - name: Debug coverage-fail-on-error
      run: |
        echo "raw=${{ inputs.coverage-fail-on-error }}"
        echo "eq_false=${{ inputs.coverage-fail-on-error == false }}"
        echo "ne_true=${{ inputs.coverage-fail-on-error != true }}"
        echo "fromjson=${{ fromJSON(inputs.coverage-fail-on-error) }}"
    - name: Upload coverage reports to Codecov
      if: ${{ inputs.coverage-files != '' }}
      continue-on-error: ${{ fromJSON(inputs.coverage-fail-on-error) == false }}
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: ${{ github.repository }}
        files: ${{ inputs.coverage-files }}
        flags: ${{ inputs.coverage-flags }}
        name: ${{ inputs.coverage-name || format('ruby-{0}-{1}', matrix.ruby, matrix.gemfile) }}
        disable_search: true
        handle_no_reports_found: true
        fail_ci_if_error: ${{ inputs.coverage-fail-on-error }}

  build_success:
    if: always()
    needs:
      - tests
    runs-on: Ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
